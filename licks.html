<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blues Licks Practice</title>
  <style>
    :root{
      --bg:#0d0e13; --tile:#171923; --tile2:#1f2230; --line:#2a2e40; --text:#f4f4f7;
      --muted:#9a9fb5; --blue:#5468ff; --green:#4ade80; --sand:#ffd9a0; --red:#ef4444;
    }
    *{box-sizing:border-box;margin:0}
    body{
      font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text);
      padding:18px;
    }
    .wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
    .card{background:var(--tile);border:1px solid var(--line);border-radius:22px;padding:18px}
    h1,h2,h3{font-family:Georgia,serif;letter-spacing:-0.03em}
    h1{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:8px}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    label{display:grid;gap:7px;color:var(--muted);font-size:0.9rem}
    input,select,button{font:inherit}
    input,select{
      width:100%; background:var(--tile2); color:var(--text); border:1px solid var(--line); border-radius:12px;
      padding:10px 12px;
    }
    button{
      border:0;border-radius:999px;padding:11px 18px;cursor:pointer;color:var(--text);background:var(--tile2);
      transition:transform .15s ease, opacity .15s ease;
    }
    button:hover{transform:translateY(-1px)}
    .primary{background:var(--blue);color:white}
    .danger{background:var(--red);color:white}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .videoWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
    #player{width:100%;height:100%}
    .status{font-size:1.2rem;font-weight:700;color:var(--sand);min-height:30px}
    .progress{height:8px;background:var(--tile2);border-radius:999px;overflow:hidden}
    .progress span{display:block;height:100%;width:0%;background:var(--blue);transition:width .15s}
    .licks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
    .lick{background:var(--tile2);border:2px solid var(--line);border-left:6px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:all .15s}
    .lick:hover{transform:translateY(-2px);border-color:var(--blue)}
    .lick.active{border-color:var(--blue);background:rgba(84,104,255,.12)}
    .lick.easy{border-left-color:var(--green)}
    .lick.medium{border-left-color:var(--sand)}
    .lick.hard{border-left-color:var(--red)}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:0.72rem;font-weight:700;text-transform:uppercase;margin-bottom:8px}
    .tag.easy{background:var(--green);color:#0a190a}
    .tag.medium{background:var(--sand);color:#1b1306}
    .tag.hard{background:var(--red);color:white}
    .lick h3{font-size:1.25rem;margin-bottom:6px}
    .lick p{font-size:0.92rem;color:var(--muted);margin:0}
    .meta{margin-top:8px;color:var(--muted);font-size:0.8rem;display:flex;justify-content:space-between;gap:8px}
    @media (max-width:640px){body{padding:12px} .wrap{gap:12px} .card{padding:14px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Blues licks practice</h1>
      <div class="controls">
        <label>
          Repetitions
          <input id="reps" type="number" min="1" max="30" value="10">
        </label>
        <label>
          Speed
          <select id="speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="status" id="status">Select a lick</div>
      <div class="progress" aria-label="practice progress"><span id="progress"></span></div>
      <div class="row" style="margin-top:14px;">
        <button class="primary" id="playSelected">Play selected</button>
        <button id="startLoop">Start 10x loop</button>
        <button id="pauseBtn">Pause</button>
        <button class="danger" id="stopBtn">Stop</button>
      </div>
    </div>

    <div class="card">
      <h2>Easy → hard</h2>
      <div id="licks" class="licks"></div>
    </div>

    <div class="card">
      <div class="videoWrap">
        <div id="player"></div>
      </div>
    </div>
  </div>

  <script>
    const VIDEO_ID = 'Sp6Dk9w0Z1U';
    const licks = [
      { id: 1, name: 'Lick 1', level: 'easy', start: 0.0, end: 6.0, note: 'Basic pentatonic motion' },
      { id: 2, name: 'Lick 2', level: 'easy', start: 6.0, end: 12.0, note: 'Simple bend and release' },
      { id: 3, name: 'Lick 3', level: 'easy', start: 12.0, end: 18.5, note: 'Light shuffle phrasing' },
      { id: 4, name: 'Lick 4', level: 'medium', start: 18.5, end: 25.5, note: 'Double-note bend phrase' },
      { id: 5, name: 'Lick 5', level: 'medium', start: 25.5, end: 32.5, note: 'Vibrato and release' },
      { id: 6, name: 'Lick 6', level: 'medium', start: 32.5, end: 39.5, note: 'Syncopated rhythm break' },
      { id: 7, name: 'Lick 7', level: 'hard', start: 39.5, end: 46.5, note: 'Fast legato run' },
      { id: 8, name: 'Lick 8', level: 'hard', start: 46.5, end: 53.5, note: 'Advanced bend combination' },
      { id: 9, name: 'Lick 9', level: 'hard', start: 53.5, end: 60.5, note: 'Full phrase with all moves' }
    ];

    let selected = licks[0];
    let player = null;
    let loopTimer = null;
    let loopRunning = false;
    let loopIndex = 0;
    let totalReps = 10;
    let paused = false;

    function fmt(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = (seconds % 60).toFixed(1).padStart(4, '0');
      return `${mins}:${secs}`;
    }

    function renderLicks() {
      const list = document.getElementById('licks');
      list.innerHTML = licks.map(lick => `
        <div class="lick ${lick.level} ${selected.id === lick.id ? 'active' : ''}" data-id="${lick.id}">
          <div class="tag ${lick.level}">${lick.level}</div>
          <h3>${lick.name}</h3>
          <p>${lick.note}</p>
          <div class="meta">
            <span>${fmt(lick.start)} → ${fmt(lick.end)}</span>
            <span>${(lick.end - lick.start).toFixed(1)}s</span>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('.lick').forEach(card => {
        card.addEventListener('click', () => {
          const id = Number(card.dataset.id);
          selected = licks.find(l => l.id === id) || licks[0];
          renderLicks();
          updateStatus(`${selected.name} selected`);
          setProgress(0);
        });
      });
    }

    function updateStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function setProgress(pct) {
      document.getElementById('progress').style.width = `${pct}%`;
    }

    function ensurePlayer() {
      if (player) return player;
      player = new YT.Player('player', {
        videoId: VIDEO_ID,
        playerVars: { rel: 0, playsinline: 1, enablejsapi: 1 },
        events: {
          onReady: () => {
            player.setPlaybackRate(Number(document.getElementById('speed').value));
            playSelected();
          }
        }
      });
      return player;
    }

    function playSelected() {
      if (!player || !player.seekTo || !player.playVideo) {
        return;
      }
      player.seekTo(selected.start, true);
      player.setPlaybackRate(Number(document.getElementById('speed').value));
      player.playVideo();
      updateStatus(`${selected.name} • ${selected.level.toUpperCase()} • ${fmt(selected.start)} → ${fmt(selected.end)}`);
    }

    function startLoop() {
      if (!player) {
        ensurePlayer();
      }
      totalReps = Math.max(1, Number(document.getElementById('reps').value) || 10);
      loopIndex = 1;
      paused = false;
      loopRunning = true;
      playSelected();
      updateStatus(`${selected.name} • rep ${loopIndex}/${totalReps}`);
      setProgress(0);
      clearInterval(loopTimer);
      loopTimer = setInterval(checkLoop, 120);
    }

    function checkLoop() {
      if (!loopRunning || !player || !player.getCurrentTime || paused) return;
      const currentTime = player.getCurrentTime();
      if (currentTime >= selected.end - 0.15) {
        loopIndex += 1;
        if (loopIndex > totalReps) {
          stopLoop();
          updateStatus('Practice complete — great work!');
          return;
        }
        updateStatus(`${selected.name} • rep ${loopIndex}/${totalReps}`);
        setProgress(((loopIndex - 1) / totalReps) * 100);
        player.seekTo(selected.start, true);
        player.playVideo();
      }
    }

    function stopLoop() {
      loopRunning = false;
      clearInterval(loopTimer);
      paused = false;
      setProgress(0);
      if (player && player.pauseVideo) {
        player.pauseVideo();
      }
    }

    function togglePause() {
      if (!loopRunning && !player) return;
      if (!player || !player.pauseVideo || !player.playVideo) return;
      paused = !paused;
      if (paused) {
        player.pauseVideo();
        updateStatus(`${selected.name} paused`);
      } else {
        player.playVideo();
        updateStatus(`${selected.name} resumed`);
      }
    }

    document.getElementById('playSelected').addEventListener('click', () => {
      ensurePlayer();
      playSelected();
    });

    document.getElementById('startLoop').addEventListener('click', () => {
      ensurePlayer();
      startLoop();
    });

    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    document.getElementById('stopBtn').addEventListener('click', () => {
      stopLoop();
      updateStatus(`${selected.name} stopped`);
    });

    document.getElementById('speed').addEventListener('change', () => {
      if (player && player.setPlaybackRate) {
        player.setPlaybackRate(Number(document.getElementById('speed').value));
      }
    });

    function init() {
      renderLicks();
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = () => {
        ensurePlayer();
      };
    }

    init();
  </script>
</body>
</html>
